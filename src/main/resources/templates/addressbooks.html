<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Address Books</title>
</head>

<body>
<h1>Address Books</h1>
<ul>
    <li th:each="book : ${addressBooks}">
        <form method="get" th:action="@{/{id}/view(id=${book.id})}">
            <button type="submit" th:text="|Address Book ${book.id}|">Address Book #</button>
        </form>
        <form method="post" th:action="@{/{id}/delete(id=${book.id})}">
            <button type="submit">Remove</button>
        </form>
    </li>
</ul>

<form method="post" th:action="@{/create}">
    <button type="submit">Create Address Book</button>
</form>

</body>

</html>
