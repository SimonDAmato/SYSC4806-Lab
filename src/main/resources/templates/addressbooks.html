<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Address Books</title>
</head>

<body>
    <h1>Address Books</h1>
    <ul>
        <li th:each="book : ${addressBooks}">
            <a th:href="@{/addressbooks/{id}/view(id=${book.id})}"
               th:text="${book.id}">Address book ID</a>
        </li>
    </ul>
</body>

</html>
